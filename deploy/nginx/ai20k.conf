# NGINX reverse proxy cho Trung Tâm Tri Thức AI (AI20K)
# - Phục vụ frontend build (SPA) tĩnh
# - Proxy /api/ + /health -> FastAPI backend (127.0.0.1:8000)
# - Tắt buffering cho SSE (/api/v1/chat/stream) để stream token mượt
# - Cho upload tới 50MB
#
# Cài đặt:
#   sudo cp deploy/nginx/ai20k.conf /etc/nginx/sites-available/ai20k.conf
#   sudo ln -sf /etc/nginx/sites-available/ai20k.conf /etc/nginx/sites-enabled/ai20k.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (Trước đó build FE: cd frontend && npm run build)

upstream ai20k_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # Tăng giới hạn upload (khớp MAX_UPLOAD_BYTES = 50MB ở backend).
    client_max_body_size 50m;

    # Thư mục build của frontend (Vite) — đổi path nếu deploy nơi khác.
    root /home/hoangvananh/C2-App-142/frontend/dist;
    index index.html;

    # --- Streaming chat (SSE): KHÔNG buffer để token hiện ngay ---
    location = /api/v1/chat/stream {
        proxy_pass http://ai20k_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # --- API + health ---
    location /api/ {
        proxy_pass http://ai20k_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://ai20k_backend;
        proxy_set_header Host $host;
    }

    # --- Frontend SPA: mọi route khác trả index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset tĩnh có hash.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
